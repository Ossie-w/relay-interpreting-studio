<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#181b2d"><title>视频长交传 · Relay</title><link rel="stylesheet" href="./style.css?v=20261112"></head>
<body><header><div class="shell top"><a class="brand" href="./index.html#studio"><span class="brandicon" aria-hidden="true">▥</span>Relay<span class="branddot">.</span></a><span class="product">DeepSeek</span><nav aria-label="Main navigation"><a href="./index.html#studio">Studio</a><a class="active" aria-current="page" href="./video.html">视频长交传</a><a href="./index.html#plan">Training plan</a><a href="./index.html#history">History</a></nav><span class="langs">EN <span>⇄</span> 中文</span></div></header>
<main class="shell"><h1>视频长交传</h1><section class="card videoSetup"><h2>从视频生成双语对照稿</h2><label>原文语言<select id="videoDir"><option value="en">英语 → 中文</option><option value="zh">中文 → 英语</option></select></label><label>视频链接<input id="videoURL" type="url" placeholder="https://www.youtube.com/watch?v=…"></label><label>原文字幕（自动读取，也可粘贴或编辑）<textarea id="captions" rows="4"></textarea></label><button id="startVideo">智能断句并生成对照稿</button><p id="videoStatus" role="status"></p><details id="sourceOptions"><summary>用视频声音转写，或导入字幕文件</summary><label>字幕文件<input id="subtitleFile" type="file" accept=".vtt,.srt,.txt"></label><label>上传你有权使用的源音频，将发送至 DeepSeek 转写<input id="videoAudio" type="file" accept="audio/*,video/mp4"></label><button type="button" id="captureVideo">转写 YouTube 标签页声音</button><p>选择正在播放视频的浏览器标签页并勾选共享声音。结束录取后，声音将发送给 DeepSeek，自动转写、断句并生成对照稿。</p><p>字幕将发送至 DeepSeek 断句并翻译，可选择一段练习。</p></details></section><section id="work" hidden><article class="card"><h2>观看演讲与记笔记</h2><div id="player"></div><details open><summary>逐句对照文稿</summary><ol id="pairs"></ol></details><label>口译笔记<textarea id="notes" rows="5"></textarea></label></article><article class="card"><h2>上传我的口译</h2><label>选择录音，发送给 DeepSeek 转写<input type="file" id="take" accept="audio/*"></label><button id="recognize">转写录音</button><label>核对转写<textarea id="confirmed" rows="7"></textarea></label><button class="action" id="evaluateVideo">保存并评级</button><p id="feedback" role="status"></p></article><article class="card" id="results" hidden></article></section></main><script type="module" src="./video.js?v=transcript2"></script></body></html>
